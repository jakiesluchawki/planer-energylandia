name: Test, refresh and deploy PogodaPark

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Raz na godzinę, poza szczytem pełnej godziny. 06:17–20:17 UTC
    # obejmuje godziny działania parku w polskiej strefie czasowej.
    - cron: "17 6-20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/shortlinks/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Install short-link service dependencies
        working-directory: services/shortlinks
        run: npm ci

      - name: Test short-link service
        working-directory: services/shortlinks
        run: npm test

      - name: Refresh queue snapshot
        run: npm run refresh:queues

      - name: Refresh official show snapshot
        run: npm run refresh:shows

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
