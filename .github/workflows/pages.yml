name: Test, refresh and deploy PogodaPark

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Raz na godzinę, poza szczytem pełnej godziny. 06:17–20:17 UTC
    # obejmuje godziny działania parku w polskiej strefie czasowej.
    - cron: "17 6-20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    # GitHub potrafi jeszcze dostarczyć opóźnione zdarzenia starego crona.
    # Nie uruchamiaj dla nich całego wdrożenia.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6-20 * * *' }}
    # Planowe odświeżenie jest best-effort: działająca poprzednia wersja jest
    # bezpieczniejsza niż alarmowy mail przy chwilowym 503 GitHub Pages.
    # Push i ręczne uruchomienie nadal kończą się błędem, jeśli deploy zawiedzie.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/shortlinks/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Install short-link service dependencies
        working-directory: services/shortlinks
        run: npm ci

      - name: Test short-link service
        working-directory: services/shortlinks
        run: npm test

      - name: Refresh queue snapshot
        run: npm run refresh:queues

      - name: Refresh official show snapshot
        run: npm run refresh:shows

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 15

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final Pages attempt
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        run: sleep 45

      - name: Final GitHub Pages deployment attempt
        id: deployment_final
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        uses: actions/deploy-pages@v4

      - name: Record deferred scheduled deployment
        if: ${{ always() && github.event_name == 'schedule' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_final.outcome == 'failure' }}
        run: echo "::warning::GitHub Pages nie przyjął planowego wdrożenia po trzech próbach. Poprzednia publiczna wersja pozostaje aktywna; następne odświeżenie spróbuje ponownie."
